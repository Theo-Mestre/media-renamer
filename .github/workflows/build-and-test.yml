name: .NET Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore MediaRenamer.slnx

      - name: Build (Release)
        run: dotnet build MediaRenamer.slnx --configuration Release --no-restore

      - name: Run xUnit tests
        run: dotnet test MediaRenamer.slnx --configuration Release --no-build --verbosity normal