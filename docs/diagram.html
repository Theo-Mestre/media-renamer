<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MediaRenamer - Architecture Sequence Diagram</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #0d1117; overflow: hidden; }
    object { width: 100%; height: 100%; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
</head>
<body>
  <object id="diagram" type="image/svg+xml" data="diagram.svg"></object>
  <script>
    document.getElementById('diagram').addEventListener('load', function () {
      svgPanZoom(this, { zoomEnabled: true, controlIconsEnabled: true, fit: true, center: true, maxZoom: 10 });
    });
  </script>
</body>
</html>
